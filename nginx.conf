user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types; # Required for SVG mime type
  default_type application/octet-stream; # Required for SVG mime type
  client_max_body_size 100M;
  limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;

  server {
    listen 80;
    server_name localhost;

    # Next.js HMR / Turbopack WebSocket — must be matched before the catch-all
    # so the upgrade headers are applied without competing with other
    # `proxy_set_header` rules. Next.js 16 renamed `/_next/webpack-hmr` to
    # `/_next/hmr`; the Turbopack dev server also accepts `/_next/turbopack-hmr`
    # as a legacy fallback. All three are forwarded with a long-lived open
    # channel so the connection survives idle periods in the editor.
    location ~ ^/_next/(hmr|webpack-hmr|turbopack-hmr) {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_connect_timeout 1h;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://web:3000;
      proxy_http_version 1.1; # Required for WebSocket
      proxy_set_header Upgrade $http_upgrade; # WebSocket header
      proxy_set_header Connection "upgrade"; # WebSocket header
      # Preserve browser host:port (e.g. localhost:5000). $host strips the port
      # and breaks Next.js redirects / absolute URLs.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_read_timeout 30m;
      proxy_connect_timeout 30m;
      # Long-lived WebSocket (HMR) connections need an open channel with no
      # buffering; default 60s read timeout silently kills Turbopack HMR.
      proxy_send_timeout 1h;
      proxy_buffering off;
    }

    location /api/v1/ {
      client_max_body_size 110M;
      error_page 413 = @request_entity_too_large;
      proxy_pass http://api:8000;
      proxy_read_timeout 30m;
      proxy_send_timeout 30m;
      proxy_connect_timeout 30m;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/login {
      limit_req zone=auth_login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v2/ {
      proxy_pass http://api:8000;
      proxy_read_timeout 30m;
      proxy_send_timeout 30m;
      proxy_connect_timeout 30m;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @request_entity_too_large {
      default_type application/json;
      return 413 '{"detail":"File size must be less than 100MB."}';
    }

    location /docs {
      proxy_pass http://api:8000/docs;
      proxy_read_timeout 30m;
      proxy_connect_timeout 30m;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
      proxy_pass http://api:8000/openapi.json;
      proxy_read_timeout 30m;
      proxy_connect_timeout 30m;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal auth subrequest used to gate /app_data/* static access behind the
    # FastAPI session cookie. FastAPI serves these files via StaticFiles; nginx
    # still runs auth_request so they are not public.
    location = /_auth_check {
      internal;
      proxy_pass http://api:8000/api/v1/auth/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header Host $host;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Authorization $http_authorization;
    }

    # Bundled UI static assets (logos, fonts packaged with the app) are safe to
    # serve unauthenticated; they contain no user data. The trailing slash on
    # the location pattern is required: with a bare `/static`, a request like
    # `/static../server.py` could escape the mount. `/static/` constrains the
    # match so the only path that lands here started with the separator.
    location /static/ {
      proxy_pass http://api:8000/static/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location /app_data/images/ {
      auth_request /_auth_check;
      proxy_pass http://api:8000/app_data/images/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 1y;
      add_header Cache-Control "private, max-age=31536000";
    }

    location /app_data/exports/ {
      auth_request /_auth_check;
      proxy_pass http://api:8000/app_data/exports/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 1y;
      add_header Cache-Control "private, max-age=31536000";
    }

    location /app_data/uploads/ {
      auth_request /_auth_check;
      proxy_pass http://api:8000/app_data/uploads/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 1y;
      add_header Cache-Control "private, max-age=31536000";
    }

    location /app_data/fonts/ {
      proxy_pass http://api:8000/app_data/fonts/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 1y;
      add_header Cache-Control "private, max-age=31536000";
    }

    location /app_data/templates/ {
      proxy_pass http://api:8000/app_data/templates/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 1y;
      add_header Cache-Control "private, max-age=31536000";
    }

    location /app_data/pptx-to-html/ {
      auth_request /_auth_check;
      proxy_pass http://api:8000/app_data/pptx-to-html/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 1y;
      add_header Cache-Control "private, max-age=31536000";
    }

    location /app_data/pptx-to-json/ {
      auth_request /_auth_check;
      proxy_pass http://api:8000/app_data/pptx-to-json/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 1y;
      add_header Cache-Control "private, max-age=31536000";
    }
  }
}
