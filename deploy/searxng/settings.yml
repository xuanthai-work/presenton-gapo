use_default_settings: true

general:
  instance_name: "Presenton SearXNG"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

server:
  # Recent SearXNG exits if this stays the image default "ultrasecretkey".
  secret_key: "presenton-internal-searxng-not-for-public"
  limiter: false
  image_proxy: false
  method: "GET"

outgoing:
  request_timeout: 8.0
