# Standalone PostHog stack for GSlide error reporting.
# This is a SEPARATE Compose project from GSlide. Do not start it from the
# repo-root docker-compose.yml. GSlide never depends on these containers.
#
# Start:  docker compose --project-name gslide-posthog -f deploy/posthog/docker-compose.yml up
# Stop:   docker compose --project-name gslide-posthog -f deploy/posthog/docker-compose.yml down
# UI:     http://localhost:8010
#
# Bootstrap once (the upstream PostHog repo is bind-mounted by the hobby file,
# so it must exist on disk and is gitignored here). Pin the commit below — the
# hobby file's fronting service is `proxy` on 80/443 at this revision.
#
# The PostHog hobby compose publishes Caddy (`proxy`) on host ports 80 and 443.
# We replace those ports with 8010:80 so it never collides with GSlide (5001)
# or SearXNG (8080), and so host 80/443 stay free.
name: gslide-posthog
include:
  - path: ./upstream/docker-compose.hobby.yml

services:
  proxy:
    ports: !override
      - "8010:80"
