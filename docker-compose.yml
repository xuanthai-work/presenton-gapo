x-web-environment: &web-environment
  - FAST_API_INTERNAL_URL=http://api:8000
  - HOSTNAME=0.0.0.0
  - PORT=3000
  - USER_CONFIG_PATH=/app_data/userConfig.json
  - APP_DATA_DIRECTORY=/app_data
  - DISABLE_ANONYMOUS_TRACKING=${DISABLE_ANONYMOUS_TRACKING:-}
  - POSTHOG_HOST=${POSTHOG_HOST:-}
  - POSTHOG_PROJECT_API_KEY=${POSTHOG_PROJECT_API_KEY:-}
  - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-}

x-api-environment: &api-environment
  - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
  - APP_DATA_DIRECTORY=/app_data
  - TEMP_DIRECTORY=/tmp/gslide
  - USER_CONFIG_PATH=/app_data/userConfig.json
  - GSLIDE_HOST_HTTP_PORT=${GSLIDE_HOST_HTTP_PORT:-${PRESENTON_HOST_HTTP_PORT:-5001}}
  - GSLIDE_HTTP_HOST_PORT=${GSLIDE_HTTP_HOST_PORT:-${PRESENTON_HTTP_HOST_PORT:-5001}}
  - MIGRATE_DATABASE_ON_STARTUP=true
  - CAN_CHANGE_KEYS=${CAN_CHANGE_KEYS:-}
  - NEXT_PUBLIC_URL=http://localhost:${GSLIDE_HTTP_HOST_PORT:-${PRESENTON_HTTP_HOST_PORT:-5001}}
  - EXPORT_PAGE_BASE_URL=http://proxy
  - LLM=${LLM:-}
  - OPENAI_API_KEY=${OPENAI_API_KEY:-}
  - OPENAI_MODEL=${OPENAI_MODEL:-}
  - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
  - GOOGLE_MODEL=${GOOGLE_MODEL:-}
  - CUSTOM_LLM_URL=${CUSTOM_LLM_URL:-}
  - CUSTOM_LLM_API_KEY=${CUSTOM_LLM_API_KEY:-}
  - CUSTOM_MODEL=${CUSTOM_MODEL:-}
  - DISABLE_IMAGE_GENERATION=${DISABLE_IMAGE_GENERATION:-}
  - ENABLE_PARALLEL_IMAGE_GENERATION=${ENABLE_PARALLEL_IMAGE_GENERATION:-true}
  - IMAGE_PROVIDER=${IMAGE_PROVIDER:-}
  - GPT_IMAGE_1_5_QUALITY=${GPT_IMAGE_1_5_QUALITY:-}
  - EXTENDED_REASONING=${EXTENDED_REASONING:-}
  - DISABLE_THINKING=${DISABLE_THINKING:-}
  - WEB_GROUNDING=${WEB_GROUNDING:-}
  - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-auto}
  - WEB_SEARCH_MAX_RESULTS=${WEB_SEARCH_MAX_RESULTS:-}
  - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://searxng:8080}
  - DATABASE_URL=${DATABASE_URL:-}
  - DISABLE_ANONYMOUS_TRACKING=${DISABLE_ANONYMOUS_TRACKING:-}
  - MEM0_LLM_MODEL=${MEM0_LLM_MODEL:-}
  - MEM0_LLM_API_KEY=${MEM0_LLM_API_KEY:-}
  - MEM0_LLM_BASE_URL=${MEM0_LLM_BASE_URL:-}
  - MEM0_ENABLED=${MEM0_ENABLED:-false}
  - MEM0_DIR=${MEM0_DIR:-/app_data/mem0}
  - MEM0_EMBEDDER_PROVIDER=${MEM0_EMBEDDER_PROVIDER:-fastembed}
  - MEM0_EMBEDDER_MODEL=${MEM0_EMBEDDER_MODEL:-BAAI/bge-small-en-v1.5}
  - MEM0_EMBEDDING_DIMS=${MEM0_EMBEDDING_DIMS:-384}
  - MEM0_SPACY_MODEL=${MEM0_SPACY_MODEL:-en_core_web_sm}
  - MEM0_REQUIRE_SPACY_MODEL=${MEM0_REQUIRE_SPACY_MODEL:-true}
  - LITEPARSE_DPI=${LITEPARSE_DPI:-120}
  - LITEPARSE_NUM_WORKERS=${LITEPARSE_NUM_WORKERS:-1}
  - OPENAI_COMPAT_IMAGE_BASE_URL=${OPENAI_COMPAT_IMAGE_BASE_URL:-}
  - OPENAI_COMPAT_IMAGE_API_KEY=${OPENAI_COMPAT_IMAGE_API_KEY:-}
  - OPENAI_COMPAT_IMAGE_MODEL=${OPENAI_COMPAT_IMAGE_MODEL:-}
  - AUTH_USERNAME=${AUTH_USERNAME:-}
  - AUTH_PASSWORD=${AUTH_PASSWORD:-}
  - AUTH_OVERRIDE_FROM_ENV=${AUTH_OVERRIDE_FROM_ENV:-}
  - RESET_AUTH=${RESET_AUTH:-}

services:
  production:
    image: nginx:1.27-alpine
    ports:
      - "${GSLIDE_HTTP_HOST_PORT:-${PRESENTON_HTTP_HOST_PORT:-5001}}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    networks:
      default:
        aliases:
          - proxy

  web:
    platform: ${GSLIDE_DOCKER_PLATFORM:-${PRESENTON_DOCKER_PLATFORM:-linux/amd64}}
    build:
      context: .
      dockerfile: Dockerfile.web
    expose:
      - "3000"
    volumes:
      - ./app_data:/app_data:ro
    environment: *web-environment
    networks:
      default:
        aliases:
          - web

  api:
    platform: ${GSLIDE_DOCKER_PLATFORM:-${PRESENTON_DOCKER_PLATFORM:-linux/amd64}}
    build:
      context: .
      dockerfile: Dockerfile.api
    expose:
      - "8000"
    volumes:
      - ./app_data:/app_data
      - ./servers/fastapi/templates:/app/servers/fastapi/templates:ro
    depends_on:
      - searxng
    environment: *api-environment
    networks:
      default:
        aliases:
          - api

  development:
    image: nginx:1.27-alpine
    ports:
      - "${GSLIDE_HTTP_HOST_PORT:-${PRESENTON_HTTP_HOST_PORT:-5001}}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-dev
      - api-dev
    networks:
      default:
        aliases:
          - proxy

  web-dev:
    platform: ${GSLIDE_DOCKER_PLATFORM:-${PRESENTON_DOCKER_PLATFORM:-linux/amd64}}
    build:
      context: .
      dockerfile: Dockerfile.dev.web
    working_dir: /app/servers/nextjs
    expose:
      - "3000"
    volumes:
      - .:/app
      - gslide_next_node_modules:/app/servers/nextjs/node_modules
      - ./app_data:/app_data:ro
    environment: *web-environment
    networks:
      default:
        aliases:
          - web

  api-dev:
    platform: ${GSLIDE_DOCKER_PLATFORM:-${PRESENTON_DOCKER_PLATFORM:-linux/amd64}}
    build:
      context: .
      dockerfile: Dockerfile.dev.api
    expose:
      - "8000"
    volumes:
      - .:/app
      - gslide_api_node_modules:/app/node_modules
      - gslide_document_extraction_liteparse:/app/document-extraction-liteparse
      - ./app_data:/app_data
    depends_on:
      - searxng
    environment: *api-environment
    networks:
      default:
        aliases:
          - api

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "${SEARXNG_HOST_PORT:-127.0.0.1:8080}:8080"
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE

volumes:
  gslide_next_node_modules:
  gslide_api_node_modules:
  gslide_document_extraction_liteparse:
